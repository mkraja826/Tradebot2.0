name: Enrollment browser security tests
on:
  push:
    branches: [admin-v2-secure-enrollment]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test admin_mcp/test_enrollment_page.cjs
