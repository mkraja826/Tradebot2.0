name: One-time encrypted demo credentials for Iowa VM

on:
  workflow_dispatch:

# Only the requested manual job can see these three existing repository secrets.
# It will commit ONLY an AES-256-GCM encrypted envelope to the public repo.
permissions:
  contents: write

concurrency:
  group: tradebot2-one-time-encrypted-credentials
  cancel-in-progress: false

jobs:
  seal:
    name: Encrypt for recipient VM and commit ciphertext only
    if: github.repository == 'mkraja826/Tradebot2.0' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install crypto dependency
        run: python -m pip install --no-input "cryptography>=44,<47"
      - name: Encrypt three existing GitHub secrets for VM only
        shell: bash
        env:
          DELTA_DEMO_API_KEY: ${{ secrets.DELTA_DEMO_API_KEY }}
          DELTA_DEMO_API_SECRET: ${{ secrets.DELTA_DEMO_API_SECRET }}
          TB_API_KEY: ${{ secrets.TB_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          if [ ! -s ops/recipient-public-key.txt ]; then
            echo "Recipient public key is not configured yet; ask assistant to add it."
            exit 1
          fi
          # Only encrypted content is written; environment secrets are not logged.
          PYTHONPATH=src python -m tradebot.sealed_transfer encrypt
      - name: Commit ONLY the encrypted envelope
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ops/sealed/tradebot-demo-credentials.enc.json
          git commit -m "Add encrypted one-time demo credentials for VM"
          git push origin HEAD:main
          echo "Encrypted payload committed. No plaintext credentials were committed."
      - name: Explain import (no credentials shown)
        run: |
          echo "On the whitelisted Iowa VM: git pull --ff-only"
          echo "Then: python -m tradebot.sealed_transfer import"
          echo "No orders or paid AI completions were submitted."
