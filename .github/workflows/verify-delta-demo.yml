name: Delta India DEMO read-only integration

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/verify-delta-demo.yml"
      - "src/tradebot/delta_probe.py"

permissions:
  contents: read

jobs:
  demo-connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DELTA_DEMO_API_KEY: ${{ secrets.DELTA_DEMO_API_KEY }}
      DELTA_DEMO_API_SECRET: ${{ secrets.DELTA_DEMO_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Public India demo BTC ticker, book and candles
        run: PYTHONPATH=src python -m tradebot.delta_probe
      - name: Full public BTC options and futures market snapshot
        run: PYTHONPATH=src python -m tradebot.delta_probe --full-snapshot
      - name: Require both Delta demo API secrets
        run: |
          missing=0
          if [ -z "$DELTA_DEMO_API_KEY" ]; then
            echo "MISSING SECRET NAME: DELTA_DEMO_API_KEY"
            missing=1
          fi
          if [ -z "$DELTA_DEMO_API_SECRET" ]; then
            echo "MISSING SECRET NAME: DELTA_DEMO_API_SECRET"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "FAILED: Add the missing names under Repository Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
          echo "Both Delta India demo credentials are configured (values hidden)."
      - name: Authenticated demo read-only account inspection
        run: |
          PYTHONPATH=src python -m tradebot.delta_probe --authenticated
          echo "Read-only Delta India DEMO account verification complete."
          echo "No exchange orders, cancellations, or positions modifications."
