name: Python tests
on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[plugin]"
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Verify commissioning checks survive optimized Python
        run: |
          python -O -m unittest discover -s tests -p 'test_fire*commission*.py' -v
          python -O -m unittest discover -s tests -p 'test_commissioning*.py' -v
      - name: Validate Cloud Shell IAM bootstrap syntax
        run: bash -n ops/bootstrap_gcp_identity.sh
      - name: Validate dashboard JavaScript syntax
        run: node --check src/tradebot/dashboard_static/app.js
      - name: Validate dashboard service shell syntax
        run: bash -n ops/run_dashboard.sh ops/install_dashboard_service.sh
      - name: Validate read-only equity monitor service shell syntax
        run: bash -n ops/run_equity_monitor.sh ops/install_equity_monitor_service.sh
