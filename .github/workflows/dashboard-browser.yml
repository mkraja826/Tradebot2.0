name: Dashboard browser checks
on:
  push:
    paths:
      - 'src/tradebot/dashboard_static/**'
      - 'tests/dashboard_browser.py'
      - 'tests/market_chart_browser.py'
      - 'tests/equity_checkpoint_browser.py'
      - '.github/workflows/dashboard-browser.yml'
  pull_request:
    paths:
      - 'src/tradebot/dashboard_static/**'
      - 'tests/dashboard_browser.py'
      - 'tests/market_chart_browser.py'
      - 'tests/equity_checkpoint_browser.py'
      - '.github/workflows/dashboard-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python tests/dashboard_browser.py
      - run: python tests/market_chart_browser.py
      - run: python tests/equity_checkpoint_browser.py
