name: Admin WebAuthn compatibility
on:
  push:
    branches: [recover/admin-mcp-v2]
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r admin_mcp/requirements-webauthn-test.txt
      - run: python -m pip check
      - name: Check adapter imports
        working-directory: admin_mcp
        run: python -c "import passkey_verify, passkey_enroll; import inspect; assert 'require_user_verification' in inspect.signature(passkey_verify.verify_authentication_response).parameters; assert 'require_user_verification' in inspect.signature(passkey_enroll.verify_registration_response).parameters"
      - run: python -m unittest discover -s admin_mcp -v
