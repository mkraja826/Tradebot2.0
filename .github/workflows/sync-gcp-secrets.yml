name: Sync GitHub secrets to GCP Secret Manager (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: tradebot2-gcp-secret-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Transfer three approved secrets (never print values)
    # Do not authorize forks, PRs, or branch-based credential transfers.
    if: github.repository == 'mkraja826/Tradebot2.0' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require non-secret Google Cloud settings
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_SYNC_SERVICE_ACCOUNT: ${{ vars.GCP_SYNC_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_WIF_PROVIDER GCP_SYNC_SERVICE_ACCOUNT; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub Actions repository VARIABLE: $name"
              exit 1
            fi
          done
          echo "Google Cloud connection settings present (no key material)."

      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SYNC_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          # Temporary federation credentials, not a long-lived JSON key.
          create_credentials_file: true
          export_environment_variables: true

      - uses: google-github-actions/setup-gcloud@v3

      - name: Add secret versions (one-way; no plaintext files or log output)
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          DELTA_DEMO_API_KEY: ${{ secrets.DELTA_DEMO_API_KEY }}
          DELTA_DEMO_API_SECRET: ${{ secrets.DELTA_DEMO_API_SECRET }}
          TB_API_KEY: ${{ secrets.TB_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          # Every variable must exist BEFORE writing any secret version.
          for name in DELTA_DEMO_API_KEY DELTA_DEMO_API_SECRET TB_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required repository secret: $name"
              exit 1
            fi
          done
          # Explicit allowlist of destination names. Append versions only.
          # No secrets are passed as command arguments or echoed to logs.
          printf '%s' "$DELTA_DEMO_API_KEY" |
            gcloud secrets versions add tradebot-delta-demo-api-key \
              --project="$GCP_PROJECT_ID" --data-file=- --quiet >/dev/null
          printf '%s' "$DELTA_DEMO_API_SECRET" |
            gcloud secrets versions add tradebot-delta-demo-api-secret \
              --project="$GCP_PROJECT_ID" --data-file=- --quiet >/dev/null
          printf '%s' "$TB_API_KEY" |
            gcloud secrets versions add tradebot-tb-api-key \
              --project="$GCP_PROJECT_ID" --data-file=- --quiet >/dev/null
          echo "Success: three encrypted secret versions stored in Google Cloud."
          echo "No Delta exchange request, AI completion, or trading order executed."
