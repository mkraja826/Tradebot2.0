name: Gold V2 continuous mark public smoke
on:
  push:
    branches: [recover/gold-v2-rebuild]
    paths:
      - '.github/workflows/gold-v2-mark-smoke.yml'
      - 'recover_trading/gold_v2_mark_smoke.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m recover_trading.gold_v2_mark_smoke
