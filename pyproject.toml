[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradebot2"
version = "0.2.0"
description = "Demo-only autonomous BTC derivatives trading bot foundation"
requires-python = ">=3.11"
dependencies = ["exchange-calendars>=4.10,<5", "cryptography>=44,<47"]

[project.optional-dependencies]
plugin = ["mcp>=1.12,<2"]

[project.scripts]
tradebot-plugin = "tradebot.chat_plugin:main"
tradebot = "tradebot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tradebot = ["dashboard_static/*.html", "dashboard_static/*.css", "dashboard_static/*.js"]
