# Install as /etc/systemd/system/tradebot2-btc-autonomous-demo.service.d/10-worker-restart-policy.conf
# Keep the read-only autonomous worker alive after process exit or VM reboot.
# This does not remove HALT flags or authorize an exchange order.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=20s
